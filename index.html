<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buat bububb 🎀</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5; /* Pink sangat muda */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(#ffb6c1 15%, transparent 16%), radial-gradient(#ffb6c1 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .container {
            background-color: #ffffff;
            max-width: 450px;
            width: 90%;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.5);
            border: 4px solid #ffb6c1;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #ff69b4; /* Hot pink */
            font-size: 26px;
            margin-top: 5px;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px #ffe4e1;
        }

        /* Dekorasi Amplop Surat Cinta Menggantikan Foto */
        .dekorasi-surat {
            background: #fff5f7;
            border: 3px solid #ffb6c1;
            padding: 25px;
            border-radius: 20px;
            font-size: 45px;
            margin: 20px auto;
            max-width: 120px;
            box-shadow: 0 6px 12px rgba(255, 182, 193, 0.2);
            animation: goyang 3s infinite ease-in-out;
        }

        @keyframes goyang {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }

        /* Area Teks Kata-Kata */
        .box-pesan {
            background-color: #ffffff;
            border: 3px dashed #ffc0cb;
            padding: 25px 20px;
            border-radius: 18px;
            margin-top: 25px;
            color: #db7093;
            font-size: 16px;
            line-height: 1.6;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            box-shadow: inset 0 2px 8px rgba(255, 182, 193, 0.05);
        }

        /* Tombol Interaktif */
        .btn-lanjut {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
            transition: 0.2s;
        }

        .btn-lanjut:hover {
            background-color: #ff1493;
            transform: scale(1.05);
        }

        .btn-lanjut:active {
            transform: scale(0.95);
        }

        /* Efek Hati Berterbangan */
        .love-efek {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            animation: terbang 3s linear infinite;
            opacity: 0;
            bottom: 0;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes terbang {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-450px) translateX(var(--x-move)) scale(0.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="judulHalaman">Maafin Aku Ya Bubub... 🥺</h1>
    
    <!-- Ikon Surat Gemas yang Menggantikan Foto -->
    <div class="dekorasi-surat" id="ikonSurat">💌</div>

    <!-- Wadah Kalimat Cerita -->
    <div class="box-pesan" id="teksPesan">
        Klik tombol di bawah untuk membuka surat kecil isi hatiku ya, Bubub... 🌸
    </div>

    <!-- Tombol Aksi -->
    <button class="btn-lanjut" id="btnAksi" onclick="tampilkanPesanBerikutnya()">Buka Surat 🧸</button>
</div>

<script>
    // ==========================================
    // 🛠️ RANGKAIAN KATA-KATA PERMOHONAN MAAF
    // ==========================================
    // Silakan edit, ubah, tambah, atau kurangi kalimat manis di bawah ini sesuai keinginan Anda:
    const kumpulanPesan = [
        "Hai Bubub sayang... Makasih ya udah mau bersedia buka halaman surat ini... 🥺❤️",
        "Aku sengaja ketik ini khusus buat Bubub, karena aku mau minta maaf yang sebesar-besarnya atas kesalahanku kemarin. 😔",
        "Aku tahu aku sering bikin Bubub kesel, kadang egois, atau kurang peka sama perasaan Bubub. Maafin aku yaaa... 🌸",
        "Aku beneran gak suka kalau kita marahan kayak gini, rasanya sepi dan hampa banget kalau gak ada kabar atau candaan dari Bubub. 😭",
        "Janji deh, setelah ini aku bakal berusaha belajar jadi lebih sabar dan lebih ngertiin kamu lagi 🧸✨",
        "Bubub masih sayang kan sama aku? Jangan diemin aku lama-lama lagi yaaa... I love you so much, Bubub! 💕💖"
    ];

    // ==========================================
    // ⚙️ LOGIKA SISTEM (JANGAN DIUBAH)
    // ==========================================
    let indeksPesan = -1;
    const elemenTeks = document.getElementById('teksPesan');
    const elemenTombol = document.getElementById('btnAksi');
    const elemenJudul = document.getElementById('judulHalaman');
    const elemenIkon = document.getElementById('ikonSurat');

    function tampilkanPesanBerikutnya() {
        indeksPesan++;
        
        // Memunculkan efek hati berterbangan setiap tombol diklik
        buatEfekHati();

        if (indeksPesan < kumpulanPesan.length) {
            // Mengubah isi teks cerita
            elemenTeks.innerText = kumpulanPesan[indeksPesan];
            elemenTombol.innerText = "Lanjut ✨";
            
            // Variasi ikon & judul agar lebih interaktif
            if (indeksPesan === 0) elemenIkon.innerText = "📂";
            if (indeksPesan === 2) {
                elemenJudul.innerText = "Jangan Marah Lagi... 👉👈";
                elemenIkon.innerText = "😭";
            }
            if (indeksPesan === 4) {
                elemenJudul.innerText = "Janji Kelinci! 🐰";
                elemenIkon.innerText = "🤝";
            }
        } else {
            // Tampilan Akhir saat Surat Selesai Dibaca
            elemenJudul.innerText = "Sayang Bubub Selamanya! 💖";
            elemenIkon.innerText = "🥰";
            elemenTeks.innerHTML = "<strong>Terima kasih sudah dimaafkan! 💐</strong><br>Yuk chat aku sekarang, bilang kalau kamu udah gak marah lagi yaa! 📱✨";
            elemenTombol.innerText = "Peluk Jauh! 🤗";
            elemenTombol.setAttribute("onclick", "hujanHatiBerkelanjutan()");
        }
    }

    // Fungsi animasi partikel hati
    function buatEfekHati() {
        for (let i = 0; i < 5; i++) {
            const hati = document.createElement('div');
            hati.className = 'love-efek';
            hati.innerText = ['❤️', '💖', '💝', '💕', '🌸'][Math.floor(Math.random() * 5)];
            
            hati.style.left = Math.random() * 80 + 10 + "%";
            hati.style.setProperty('--x-move', (Math.random() * 100 - 50) + 'px');
            hati.style.animationDuration = (Math.random() * 1.5 + 1.5) + 's';
            
            document.querySelector('.container').appendChild(hati);
            
            setTimeout(() => hati.remove(), 3000);
        }
    }

    // Fungsi bonus efek hujan hati melimpah di akhir
    function hujanHatiBerkelanjutan() {
        setInterval(buatEfekHati, 250);
        elemenTombol.disabled = true;
        elemenTombol.innerText = "Dimaafkan! 💕";
    }
</script>

</body>
</html>
